start:
  name: Lightshow starten
  description: Startet eine Szene aus einem installierten Show-Paket.
  fields:
    area_id:
      name: Bereichs-ID
      description: Optional; ohne Angabe wird der erste Bereich gestartet.
      selector:
        text:
    pack_id:
      name: Show-Paket-ID
      required: true
      example: christmas
      selector:
        text:
    scene_id:
      name: Szenen-ID
      required: true
      example: advent
      selector:
        text:
start_program:
  name: Show-Ablauf starten
  description: Spielt die Szenen eines Show-Ablaufs im Kreis bis zum manuellen Stopp ab.
  fields:
    area_id:
      name: Bereichs-ID
      description: Optional; ohne Angabe wird der erste Bereich gestartet.
      selector:
        text:
    pack_id:
      name: Show-Paket-ID
      required: true
      selector:
        text:
    program_id:
      name: Ablauf-ID
      required: true
      selector:
        text:
stop:
  name: Lightshow stoppen
  description: Stoppt den angegebenen Bereich und stellt Lichtzustände bestmöglich wieder her. Ohne Bereichs-ID werden alle Bereiche gestoppt.
  fields:
    area_id:
      name: Bereichs-ID
      description: Leer lassen, um alle Bereiche zu stoppen.
      selector:
        text:
