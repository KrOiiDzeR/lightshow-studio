<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lightshow Studio · lokale Entwicklungsvorschau</title>
<style>body{margin:24px;background:#1c1c1c;color:#eee;font:14px Arial;--primary-text-color:#eee;--secondary-text-color:#aaa;--ha-card-background:#252525;--divider-color:#454545;--error-color:#d93b4c;--success-color:#3d9866;--ls-color-scheme:dark}main{max-width:1012px;margin:auto}.demo{font-size:13px;margin:0 auto 18px;max-width:1012px;line-height:1.6}.demo button{padding:9px 15px;background:#333;color:#eee;border:1px solid #777;border-radius:7px;cursor:pointer}</style>
<div class="demo"><strong>Lokale Entwicklungsvorschau · 2.1</strong><br>Beispieldaten. Keine Verbindung zu Home Assistant oder echten Lampen.<br><button id="operation">Bedienung / Dashboard</button> <button id="configuration">Integration einrichten</button></div><main></main>
<script>/* Lightshow Studio 2.0 beta — self contained Home Assistant Lovelace card.
 * Event packs are ordinary JSON objects; no JS changes required to add packs.
 */
const LS_ROLES = [['upper','⬆️ Oben'],['lower','⬇️ Unten'],['entrance','🚪 Haustür'],['other','💡 Andere']];
const LS_MODES = [
 ['candle','🕯️ Kerzenflackern'],['fireplace','🔥 Kaminfeuer'],['sparkle','✨ Funkeln'],
 ['breathe','🌫️ Atmen'],['blink','⚡ Blinken'],['colorloop','🌈 Farbwechsel'],
 ['sunset','🌇 Sonnenuntergang'],['sunrise','🌅 Sonnenaufgang'],['opal','💎 Opal'],
 ['glisten','💫 Glitzern'],['underwater','🌊 Unterwasser'],['cosmos','🌌 Kosmos'],
 ['sunbeam','☀️ Sonnenstrahl'],['enchant','🪄 Verzaubern'],
 ['red','🔴 Rot'],['purple','🟣 Violett'],['green','🟢 Grün'],
 ['warm','🟠 Warmweiß'],['gold','🟡 Gold'],['blue','🔵 Blau'],['ice','🧊 Eisblau'],
 ['white','⚪ Weiß'],['custom_color','🎨 Eigene Farbe'],['off','🌑 Aus']
];
const LS_ESC = v => String(v ?? '').replace(/[&<>"']/g, x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const LS_COPY = data => JSON.parse(JSON.stringify(data));
const LS_CUE = () => ({mode:'candle',brightness:65,speed:55,color:'#FF8730'});
const LS_COLORS = {halloween:'#f69e42',christmas:'#5bc49c',party:'#b596ff',ambience:'#8cd4db'};
const LS_DEF = (role) => role==='upper'?'top':role==='lower'?'bottom':'auto';

class LightshowStudio extends HTMLElement {
 constructor(){
   super(); this.attachShadow({mode:'open'}); this._data=null; this._settings=null;
   this._tab='shows'; this._pack='halloween'; this._scene='castle'; this._dirty=false;
   this._busy=false;this._loading=false;this._error='';this._info='';this._importOpen=false;this._exportOpen=false;
   this._migratedShown=false;this._importText='';this._folders={};
 }
 setConfig(config){
   if(config?.background && !['transparent','theme'].includes(config.background))throw Error('background: transparent oder theme verwenden');
   this._config=config||{};if(config?.area_id&&!this._area)this._area=config.area_id;this._render();
 }
 get _isConfiguration(){return false;}
 static getStubConfig(){return {type:'custom:lightshow-studio'};}
 getCardSize(){return this._tab==='editor'?15:9;}
 set hass(h){this._hass=h;if(this.isConnected&&!this._data&&!this._busy)this._load();}
 connectedCallback(){this._render();if(this._hass&&!this._data)this._load();this._timer=window.setInterval(()=>{if(!this._busy&&this._hass)this._load(true);},8500);
   this.shadowRoot.addEventListener('click',e=>this._click(e));
   this.shadowRoot.addEventListener('change',e=>this._change(e));
   this.shadowRoot.addEventListener('input',e=>this._input(e));
   this.shadowRoot.addEventListener('submit',e=>{if(e.target.dataset.form==='area-create'){e.preventDefault();this._createArea();}});
   this.shadowRoot.addEventListener('toggle',e=>{if(e.target.matches('details[data-folder]'))this._folders[e.target.dataset.folder]=e.target.open;},true);
   this.shadowRoot.addEventListener('keydown',e=>{const tab=e.target.closest('[data-action="tab"]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const tabs=this._allowedTabs(),current=tabs.indexOf(this._tab);this._tab=e.key==='Home'?tabs[0]:e.key==='End'?tabs.at(-1):tabs[(current+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];this._render();this.shadowRoot.querySelector(`[data-action="tab"][data-id="${this._tab}"]`).focus();});
 }
 disconnectedCallback(){if(this._timer)window.clearInterval(this._timer);}
 async _ws(action, extra={}){if(!this._hass)throw Error('Keine Home Assistant-Verbindung');return this._hass.callWS({type:`lightshow_studio/${action}`,...(this._area?{area_id:this._area}:{}),...extra});}
 async _load(statusOnly=false){
   if(this._busy||this._loading)return;this._loading=true;
   try{const data=await this._ws('get');this._data=data;this._area=data.area_id||this._area;
     if(this._dirty&&statusOnly)return;
     if(!this._dirty){this._settings=LS_COPY(data.settings);this._ensureSelected();}
     this._error='';if(statusOnly&&this.shadowRoot.activeElement?.matches('input,select,textarea'))return;this._render();
   }catch(err){if(err?.code==='invalid_area')this._area=null;this._error=err?.message||String(err);this._render();}finally{this._loading=false;}
 }
 _ensureSelected(){
   if(!this._settings?.packs?.length)return;
   if(!this._settings.packs.some(p=>p.id===this._pack))this._pack=this._settings.packs.find(p=>p.id===this._data.status.pack_id)?.id||this._settings.packs[0].id;
   if(!this._packObj()?.scenes.some(s=>s.id===this._scene))this._scene=(this._data.status.pack_id===this._pack?this._packObj().scenes.find(s=>s.id===this._data.status.scene_id)?.id:null)||this._packObj().scenes[0].id;
 }
 _packObj(){return this._settings?.packs.find(p=>p.id===this._pack);}
 _sceneObj(){return this._packObj()?.scenes.find(s=>s.id===this._scene);}
 _entities(){const ls=Object.entries(this._hass?.states||{}).filter(([id])=>id.startsWith('light.')).map(([id,s])=>({id,name:s.attributes.friendly_name||id}));
   for(const f of this._settings?.fixtures||[])if(!ls.some(x=>x.id===f.entity_id))ls.push({id:f.entity_id,name:`${f.entity_id} (offline)`});
   return ls.sort((a,b)=>a.name.localeCompare(b.name,'de'));
 }
 _options(arr,value,placeholder=''){return (placeholder?`<option value="">${LS_ESC(placeholder)}</option>`:'')+arr.map(([v,label])=>`<option value="${LS_ESC(v)}" ${String(v)===String(value)?'selected':''}>${LS_ESC(label)}</option>`).join('');}
 _entitiesOptions(id){const occupied=new Set((this._data.configuration?.areas||[]).filter(a=>a.id!==this._area).flatMap(a=>a.settings.fixtures.map(f=>f.entity_id)));return this._options(this._entities().filter(x=>!occupied.has(x.id)||x.id===id).map(x=>[x.id,x.name+' · '+x.id]),id,'Lampe auswählen');}
 _devicesOptions(name){return this._options((this._data?.devices||[]).map(d=>[d.friendly_name,d.friendly_name]),name,'Automatisch erkennen');}
 _cueControls(cue,kind,index){const opts=this._options(LS_MODES,cue.mode);return `<div class="cuegrid">
   <label>Effekt <select data-field="cue-mode" data-kind="${kind}" data-index="${index}">${opts}</select></label>
   <label>Helligkeit <div class="value">${cue.brightness}%</div><input data-field="brightness" data-kind="${kind}" data-index="${index}" type="range" min="0" max="100" step="5" value="${cue.brightness}"></label>
   <label>Tempo <div class="value">${cue.speed}%</div><input data-field="speed" data-kind="${kind}" data-index="${index}" type="range" min="0" max="100" step="5" value="${cue.speed}"></label>
   ${cue.mode==='custom_color'?`<label>Farbe <input data-field="cue-color" data-kind="${kind}" data-index="${index}" type="color" value="${LS_ESC(cue.color)}"></label>`:''}
  </div>`;}
 _allowedTabs(){return this._isConfiguration?['areas','connection','lights','editor','shuffle','library']:['shows','schedule'];}
 _tabInfo(){return {areas:['🏡','Bereiche','Anlegen & verwalten'],connection:['🔌','Verbindung','Zigbee2MQTT'],lights:['💡','Lampen','Zuordnen & einrichten'],editor:['🎛️','Editor','Szenen & Abläufe'],shuffle:['🔀','Shuffle','Szenen auswählen'],library:['📦','Pakete','Import & Sicherung'],shows:['🎬','Shows','Auswählen & starten'],schedule:['🕓','Zeitplan','Woche & Jahres-Events']};}
 _tabs(){return this._allowedTabs().map(id=>{const [icon,title,description]=this._tabInfo()[id];return `<button class="navbtn ${this._tab===id?'selected':''}" role="tab" aria-selected="${this._tab===id}" aria-controls="ls-view" aria-label="${icon} ${title}" tabindex="${this._tab===id?'0':'-1'}" data-action="tab" data-id="${id}"><span class="tabIcon" aria-hidden="true">${icon}</span><span class="tabCopy"><strong>${title}</strong><small>${description}</small></span><span class="tabMarker" aria-hidden="true">${this._tab===id?'●':'›'}</span></button>`;}).join('');}
 _folder(id,icon,title,description,content){return `<details class="folder" data-folder="${LS_ESC(id)}" ${this._folders[id]!==false?'open':''}><summary><span class="folderIcon" aria-hidden="true">${icon}</span><span class="folderCopy"><strong>${LS_ESC(title)}</strong><small>${LS_ESC(description)}</small></span><span class="folderChevron" aria-hidden="true">⌄</span></summary><div class="folderBody">${content}</div></details>`;}
 _duration(seconds){return seconds%60===0?`${seconds/60} Min.`:`${Math.floor(seconds/60)} Min. ${seconds%60} Sek.`;}
 _packSelector(){return `<div class="packselect">${this._settings.packs.map(p=>`<button class="packpill ${p.id===this._pack?'sel':''}" data-action="pack" data-id="${LS_ESC(p.id)}">${LS_ESC(p.icon)} ${LS_ESC(p.name)}</button>`).join('')}</div>`;}
 _renderShows(){const pack=this._packObj(),st=this._data.status;
 const scenes=`${this._packSelector()}<div class="titleline"><div><h3>${LS_ESC(pack.icon)} ${LS_ESC(pack.name)}</h3><p>${LS_ESC(pack.description)}</p></div></div><div class="scenes">${pack.scenes.map(s=>`<button class="scene ${s.id===this._scene?'active':''}" aria-pressed="${s.id===this._scene}" data-action="scene" data-id="${LS_ESC(s.id)}"><span class="bigemoji">${LS_ESC(s.icon)}</span><strong>${LS_ESC(s.name)}</strong><small>${LS_ESC(s.description||'Lichtszene')}</small></button>`).join('')}</div>`;
 const runningPack=this._settings.packs.find(p=>p.id===st.pack_id),runningScene=runningPack?.scenes.find(s=>s.id===st.scene_id);
 const controls=`<div class="controlbox"><div><strong>${st.running?'● Show läuft':'○ Bereit zum Start'}</strong><p>${st.running?LS_ESC(runningPack?.name||st.pack_id)+' / '+LS_ESC(runningScene?.name||st.scene_id):'Die gewählte Szene startet nur in diesem Bereich. Vorherige Lichtzustände werden soweit möglich gemerkt.'}</p></div><div class="actions"><button class="primary" data-action="start" ${this._busy||this._dirty?'disabled':''}>▶ ${st.running?'Szene wechseln':'Show starten'}</button><button class="stop" data-action="stop" ${this._busy||!st.running?'disabled':''}>■ Stopp & zurücksetzen</button></div></div>`;
 const programs=`<div class="programlist">${(pack.programs||[]).map(pr=>`<div class="librow"><div><strong>${LS_ESC(pr.icon)} ${LS_ESC(pr.name)}</strong><p>${pr.steps.length} Szenen · automatisch in Schleife</p></div><button class="outline" data-action="start-program" data-id="${LS_ESC(pr.id)}" ${this._busy||this._dirty?'disabled':''}>▶ Ablauf starten</button></div>`).join('')}${!(pack.programs||[]).length?`<p class="small muted">Noch keine Abläufe eingerichtet.</p>`:''}</div>`;
 return this._folder('show-selection','🎨','Show auswählen','Erst ein Paket, dann deine Lichtszene wählen',scenes)+this._folder('show-control','▶','Show steuern','Starten, wechseln oder diesen Bereich zurücksetzen',controls)+this._folder('show-programs','🎞️','Szenen als Ablauf','Mehrere Szenen automatisch nacheinander abspielen',programs)+this._renderEffects();}
 _renderLights(){const suggestions=this._data.suggestions||{};return `<div class="titleline"><div><h3>💡 Zentrale Lampenliste</h3><p>Einmal einrichten – anschließend funktionieren alle Show-Pakete mit denselben Lampen.</p></div><button class="outline" data-action="automap">↻ Erkennen</button></div>
 <p class="small muted">${this._data.devices?.length?`${this._data.devices.length} Zigbee2MQTT-Geräte erkannt. Für natives Dymera-Tempo Gerät und Lichtbereich zuordnen.`:'Noch keine Zigbee2MQTT-Geräteliste empfangen. Die Steuerung über HA-Entitäten ist weiterhin verfügbar.'}</p>
 ${this._settings.fixtures.map((f,i)=>`<div class="fixture"><div class="fixturehead"><strong>Leuchte ${i+1}</strong><div class="right"><label class="inline"><input data-field="fixture-enabled" data-index="${i}" type="checkbox" ${f.enabled?'checked':''}> Aktiv</label><button class="minibtn danger" data-action="remove-fixture" data-index="${i}">− Entfernen</button></div></div><div class="fields">
 <label class="wide">Home-Assistant-Lampe<select data-field="fixture-entity" data-index="${i}">${this._entitiesOptions(f.entity_id)}</select></label>
 <label>Gruppe<select data-field="fixture-role" data-index="${i}">${this._options(LS_ROLES,f.role)}</select></label>
 <label>Zigbee2MQTT-Gerät<select data-field="fixture-friend" data-index="${i}">${this._devicesOptions(f.friendly_name||suggestions[f.entity_id]||'')}</select></label>
 <label>Dymera-Lichtbereich<select data-field="fixture-endpoint" data-index="${i}">${this._options([['auto','Automatisch'],['top','⬆️ Oben'],['bottom','⬇️ Unten']],f.endpoint)}</select></label>
 </div></div>`).join('')}
 <button class="dashed" data-action="add-fixture">＋ Lampe hinzufügen</button>
 <p class="small muted">Für Dymera: oben und unten als <b>zwei Entitäten</b> anlegen, beide auf denselben Zigbee2MQTT-Gerätenamen beziehen. Standard-Lampen funktionieren über Home Assistant (abhängig von unterstützten Effekten).</p>`;}
 _renderEditor(){const s=this._sceneObj();const html=`<div class="titleline"><div><h3>🎛️ Szenen-Editor</h3><p>Vier Gruppen festlegen – einzelne Lampen bei Bedarf anders steuern.</p></div></div>
 <div class="sceneSelect">${this._packObj().scenes.map(x=>`<button class="scenechip ${x.id===this._scene?'active':''}" data-action="scene" data-id="${LS_ESC(x.id)}">${LS_ESC(x.icon)} ${LS_ESC(x.name)}</button>`).join('')}</div>
 <div class="actions spaced"><button class="outline" data-action="clone-scene">⧉ Szene kopieren</button><button class="outline" data-action="new-scene">＋ Szene erstellen</button><button class="outline danger" data-action="remove-scene" ${this._packObj().scenes.length<=1?'disabled':''}>− Szene löschen</button></div>
 <div class="fields topGap"><label>Szene <input data-field="scene-name" value="${LS_ESC(s.name)}" maxlength="70"></label><label>Symbol <input data-field="scene-icon" value="${LS_ESC(s.icon)}" maxlength="12"></label></div>
 <div class="trackgrid">${LS_ROLES.map(([role,name])=>`<section class="track"><h4>${name}</h4>${this._cueControls(s.tracks[role],'track',role)}</section>`).join('')}</div>
 <h4 class="overridesTitle">Einzelne Lampen anders steuern</h4><p class="small muted">Die Gruppen gelten für alle Lampen. Ausnahmen überschreiben die Gruppeneinstellung nur in dieser Szene.</p>
 ${s.overrides.map((o,i)=>`<div class="override"><div class="fixturehead"><strong>🎯 Ausnahme ${i+1}</strong><div class="right"><button class="minibtn" data-action="preview" data-eid="${LS_ESC(o.entity_id)}" ${this._busy||this._dirty||this._data.status.running?'disabled':''}>▶ 10 s testen</button><button class="minibtn danger" data-action="remove-override" data-index="${i}">−</button></div></div>
 <label>Leuchte<select data-field="override-entity" data-index="${i}">${this._options(this._settings.fixtures.map(f=>[f.entity_id,f.entity_id]),o.entity_id)}</select></label>${this._cueControls(o,'override',i)}</div>`).join('')}
 <button class="dashed" data-action="add-override">＋ Ausnahme für eine Lampe</button>
 <h4 class="overridesTitle">🎞️ Show-Abläufe für dieses Paket</h4><p class="small muted">Lege die Reihenfolge und Spieldauer der Szenen fest. Am Ende beginnt der Ablauf erneut.</p>
 ${(this._packObj().programs||[]).map((pr,pi)=>`<div class="fixture"><div class="fixturehead"><strong>${LS_ESC(pr.icon)} ${LS_ESC(pr.name)}</strong><button class="minibtn danger" data-action="remove-program" data-index="${pi}">− Ablauf</button></div>
 <div class="fields"><label>Name <input data-field="program-name" data-program="${pi}" value="${LS_ESC(pr.name)}" maxlength="70"></label><label>Symbol <input data-field="program-icon" data-program="${pi}" value="${LS_ESC(pr.icon)}" maxlength="12"></label></div>
 ${pr.steps.map((step,si)=>`<div class="fields topGap"><label>Schritt ${si+1}: Szene<select data-field="step-scene" data-program="${pi}" data-index="${si}">${this._options(this._packObj().scenes.map(sc=>[sc.id,sc.icon+' '+sc.name]),step.scene_id)}</select></label><label>Dauer (Sekunden)<input type="number" min="10" max="3600" data-field="step-duration" data-program="${pi}" data-index="${si}" value="${step.duration}"></label><button class="minibtn danger" data-action="remove-step" data-program="${pi}" data-index="${si}" ${pr.steps.length===1?'disabled':''}>− Schritt entfernen</button></div>`).join('')}
 <button class="dashed" data-action="add-step" data-program="${pi}" ${pr.steps.length>=50?'disabled':''}>＋ Nächste Szene</button></div>`).join('')}
 <button class="dashed" data-action="new-program">＋ Neuen Show-Ablauf erstellen</button>
 <div class="actions spaced"><button class="outline" data-action="preview-group" ${this._busy||this._dirty||this._data.status.running?'disabled':''}>▶ Erste aktive Lampe 10 s testen</button></div>`;
 const overrideAt=html.indexOf('<h4 class="overridesTitle">Einzelne Lampen'),programAt=html.indexOf('<h4 class="overridesTitle">🎞️ Show-Abläufe');
 return this._folder('editor-groups','🎛️','Szene & Lichtgruppen','Effekte, Farben, Helligkeit und Tempo',html.slice(0,overrideAt).replace(/<h3>.*?<\/h3>/,''))+this._folder('editor-overrides','🎯','Einzelne Lampen','Abweichungen von der Gruppeneinstellung',html.slice(overrideAt,programAt).replace(/<h4.*?<\/h4>/,''))+this._folder('editor-programs','🎞️','Show-Abläufe bearbeiten','Reihenfolge, Dauer und Vorschau',html.slice(programAt).replace(/<h4.*?<\/h4>/,''));}
 _renderAreaOverview(){const areas=this._data.areas||[];if(!areas.length)return '';return `<section class="areaOverview"><div class="areaGrid">${areas.map(a=>`<button class="areaTile ${a.id===this._area?'selected':''}" data-action="area" data-id="${LS_ESC(a.id)}" aria-pressed="${a.id===this._area}" aria-label="Bereich ${LS_ESC(a.name)} auswählen"><span class="areaHeading">${LS_ESC(a.icon)} ${LS_ESC(a.name)}</span>${a.id===this._area?'<span class="areaSelected">✓ Ausgewählt</span>':''}<span class="areaState ${a.running?'live':''}">${a.running?'● Show läuft':a.previewing?'◐ Vorschau':'○ Bereit'}</span><span class="small muted">${a.lights} Lampen${a.running?' · '+LS_ESC(a.program||a.scene):''}</span>${a.running?`<span class="small muted">${LS_ESC(a.pack)}${a.source==='schedule'?' · Zeitplan':''}</span>`:''}${a.warnings?.length?`<span class="small">⚠ ${a.warnings.length} Hinweise</span>`:''}</button>`).join('')}</div></section>`;}
 _renderAreas(){const areas=this._data.areas||[],selected=areas.find(a=>a.id===this._area);if(!selected)return '<p>Bereichsdaten werden geladen.</p>';return `<h3>🏡 Bereiche konfigurieren</h3><p class="small muted">Jeder Bereich hat eigene Lampen, Pakete, Szenen, Abläufe und Zeitpläne. Wähle oben den Bereich und richte ihn über die Reiter ein. Mehrere Bereiche können gleichzeitig laufen.</p>
 <div class="fixture"><h4>Gewählter Bereich</h4><div class="fields"><label>Bereichsname<input data-field="area-name" value="${LS_ESC(selected.name)}" maxlength="70"></label><label>Bereichssymbol<input data-field="area-icon" value="${LS_ESC(selected.icon)}" maxlength="12"></label></div><div class="actions"><button class="outline" data-action="rename-area">Bereich übernehmen</button><button class="outline danger" data-action="remove-area" ${areas.length<=1?'disabled':''}>− Bereich löschen</button></div>${this._removeArea===selected.id?`<div class="areaDelete" role="group" aria-label="Bereich löschen bestätigen"><strong>„${LS_ESC(selected.name)}“ wirklich löschen?</strong><p class="small muted spaced">Die Lampenzuordnungen, Pakete und Zeitpläne dieses Bereichs werden entfernt. Andere Bereiche bleiben erhalten.</p><div class="actions"><button class="stop" data-action="confirm-remove-area" ${this._busy?'disabled':''}>Ja, Bereich löschen</button><button class="outline" data-action="cancel-remove-area" ${this._busy?'disabled':''}>Behalten</button></div></div>`:''}</div>
 ${this._newArea?`<form class="fixture areaCreate" data-form="area-create" novalidate><div class="fixturehead"><h4>✨ Neuen Bereich anlegen</h4><span class="small muted">${areas.length} von 30 belegt</span></div><div class="fields"><label>Name des neuen Bereichs<input data-field="area-create-name" value="${LS_ESC(this._newArea.name)}" placeholder="Zum Beispiel Garten oder Pool" maxlength="70" autocomplete="off" ${this._busy?'disabled':''}></label><label>Symbol des neuen Bereichs<input data-field="area-create-icon" value="${LS_ESC(this._newArea.icon)}" maxlength="12" ${this._busy?'disabled':''}></label></div><p class="small muted spaced">Dein neuer Bereich bekommt eine eigene Lampenliste, Shows und Zeitpläne.</p>${this._newArea.error?`<p class="alerts" role="alert">${LS_ESC(this._newArea.error)}</p>`:''}<div class="actions"><button type="submit" class="primary" ${this._busy?'disabled':''}>${this._busy?'Wird angelegt …':'✓ Bereich erstellen'}</button><button type="button" class="outline" data-action="cancel-add-area" ${this._busy?'disabled':''}>Abbrechen</button></div></form>`:`<button class="dashed" data-action="add-area" ${areas.length>=30?'disabled':''}>＋ Bereich anlegen</button>`}<div class="help">Bis zu 30 Bereiche, beispielsweise Außenwand, Garten, Badewanne und Pool. Neue Bereiche beginnen mit leerer Lampenliste und eigenen Kopien der Standardpakete. Eine Lampe kann nur einem Bereich zugeordnet werden. Die Zigbee2MQTT-Verbindung wird gemeinsam verwendet.</div>`;}
 _shufflePool(){return this._settings.shuffle_scenes||this._packObj().scenes.map(scene=>({pack_id:this._pack,scene_id:scene.id}));}
