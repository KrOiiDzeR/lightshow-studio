name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests -v
      - run: node --check custom_components/lightshow_studio/static/lightshow-studio.js
      - run: node tests/ui_smoke.cjs
      - name: Browser regression and legacy resource migration
        run: |
          npm install --prefix "$RUNNER_TEMP/lightshow-browser" --no-save --package-lock=false playwright
          "$RUNNER_TEMP/lightshow-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/lightshow-browser/node_modules/playwright" node scripts/preview_dev.cjs
      - run: python scripts/build_release.py
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
