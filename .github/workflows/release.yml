name: Publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v; add its CHANGELOG entry first (e.g. 2.0.0-beta.3)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare and test version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python scripts/set_version.py "$VERSION"
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists; publish a new version instead."
            exit 1
          fi
          python scripts/check_repository.py
          python -m unittest discover -s tests -v
          node --check custom_components/lightshow_studio/static/lightshow-studio.js
          node tests/ui_smoke.cjs
          python scripts/build_release.py
      - uses: home-assistant/actions/hassfest@master
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
      - name: Commit, tag and publish
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/lightshow_studio/manifest.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "Release v$VERSION"
            git push origin HEAD:main
          fi
          git tag -a "v$VERSION" -m "Lightshow Studio $VERSION"
          git push origin "v$VERSION"
          python - "$VERSION" <<'PY'
          import pathlib, sys
          text = pathlib.Path('CHANGELOG.md').read_text()
          section = text.split('## '+sys.argv[1], 1)[1].split('\n## ', 1)[0]
          pathlib.Path('dist/RELEASE_NOTES.md').write_text('## '+sys.argv[1]+section)
          PY
          options=()
          if [[ "$VERSION" == *-beta.* || "$VERSION" == *-rc.* ]]; then
            options+=(--prerelease)
          else
            options+=(--latest)
          fi
          gh release create "v$VERSION" "dist/lightshow-studio-$VERSION.zip" dist/SHA256SUMS --verify-tag --title "Lightshow Studio $VERSION" --notes-file dist/RELEASE_NOTES.md "${options[@]}"
